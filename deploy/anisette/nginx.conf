# TLS + WebSocket proxy for anisette-v3.
# Needed only when the app host is not the anisette host. The Go client
# rewrites https:// to wss:// for /v3/provisioning_session, so plain HTTP
# proxying of the upgrade is enough here; TLS terminates at nginx.
server {
    listen 443 ssl;
    http2 on;
    server_name anisette.example.com;

    ssl_certificate     /etc/letsencrypt/live/anisette.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/anisette.example.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    # The provisioning handshake can take a while on a cold container.
    proxy_read_timeout 120s;
    proxy_send_timeout 120s;
    client_max_body_size 1m;

    # No request bodies or identifiers in access logs.
    access_log off;

    location / {
        proxy_pass http://127.0.0.1:6969;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        # Required for /v3/provisioning_session
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
    }
}
